<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stash | Temas & Prioridade</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="img/stash_icon.png">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-brush-fill" viewBox="0 0 16 16">
  <path d="M15.825.12a.5.5 0 0 1 .132.584c-1.53 3.43-4.743 8.17-7.095 10.64a6.1 6.1 0 0 1-2.373 1.534c-.018.227-.06.538-.16.868-.201.659-.667 1.479-1.708 1.74a8.1 8.1 0 0 1-3.078.132 4 4 0 0 1-.562-.135 1.4 1.4 0 0 1-.466-.247.7.7 0 0 1-.204-.288.62.62 0 0 1 .004-.443c.095-.245.316-.38.461-.452.394-.197.625-.453.867-.826.095-.144.184-.297.287-.472l.117-.198c.151-.255.326-.54.546-.848.528-.739 1.201-.925 1.746-.896q.19.012.348.048c.062-.172.142-.38.238-.608.261-.619.658-1.419 1.187-2.069 2.176-2.67 6.18-6.206 9.117-8.104a.5.5 0 0 1 .596.04"/>
</svg>
</head>
<body>
<div class="phone">
  <!-- SPLASH -->
  <div class="screen" id="splash">
    <div class="splash-noise"></div>
    <div class="splash-content">
      <img src="img/logo.png" class="splash-icon" alt="Stash Logo">
      <div class="splash-title">
        Stash
        <span>temas · prioridade instantânea</span>
      </div>
      <button class="btn-start" id="startBtn">Começar</button>
    </div>
  </div>
 
  <!-- MAIN -->
  <div class="screen hidden" id="main">
    <div class="topbar">
      <button class="btn-back" id="backBtn">‹</button>
      <div class="topbar-title">Stash</div>
      <button class="theme-btn" id="themeMenuBtn"><i class="bi bi-brush-fill"></i></button>
      <div class="topbar-count" id="task-count">0 tasks</div>
    </div>
    
 
    <div class="list-wrapper" id="task-list">
      <div class="empty-state" id="empty-state">
        <span class="emoji">✨</span>
        Nenhuma task ainda.<br>Adicione sua primeira!
      </div>
    </div>
 
    <div class="fab-area">
      <div style="width:100%; display:flex; flex-direction:column; gap:8px;">
        <div class="color-row" id="color-row"></div>
        <div style="display:flex; gap:10px; align-items:center;">
          <input class="fab-input" id="task-input" placeholder="Nova task..." maxlength="60" autocomplete="off" autocorrect="off" spellcheck="false">
          <button class="fab-btn" id="addBtn">+</button>
        </div>
      </div>
    </div>
  </div>
 
  <!-- TEMA MODAL -->
  <div id="themeModal" class="theme-overlay">
    <div class="theme-panel">
      <h3>Temas</h3>
      <p>Escolha seu estilo — as cores das suas tasks serão atualizadas</p>
      <div id="themeListContainer" class="theme-list"></div>
      <button class="close-theme-btn" id="closeThemeBtn">Fechar</button>
    </div>
  </div>
 
  <div id="toastMsg" class="toast-msg"></div>
</div>
 
<script src="script.js"></script>
</body>
</html>
