<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Stash | Temas & Prioridade</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" type="image/png" href="img/stash_icon.png">
</head>
<body>
<div class="phone">
  <div class="screen" id="splash">
    <div class="splash-noise"></div>
    <div class="splash-content">
      <img src="img/logo.png" class="splash-icon" alt="logo-stash" onerror="this.style.display='none'">
      <div class="splash-title">
        Stash
        <span>temas · prioridade instantânea</span>
      </div>
      <button class="btn-start" id="startBtn">Começar</button>
    </div>
  </div>
 
  <div class="screen hidden" id="main">
    <div class="topbar">
      <button class="btn-back" id="backBtn">‹</button>
      <div class="topbar-title">Stash</div>
      <button class="theme-btn" id="themeMenuBtn"><i class="bi bi-brush-fill"></i></button>
      <div class="topbar-count" id="task-count">0 tasks</div>
    </div>

    <div class="list-wrapper">
      <div class="empty-state" id="empty-state">
        <i class="bi bi-stars empty-icon"></i>
        <div class="empty-text">
          Nenhuma task ainda.<br>Adicione sua primeira!
        </div>
      </div>
      <div id="task-list"></div>
    </div>
 
    <div class="fab-area">
      <div style="width:100%; display:flex; flex-direction:column; gap:8px;">
        <div class="color-row" id="color-row"></div>
        <div style="display:flex; gap:10px; align-items:center;">
          <input class="fab-input" id="task-input" placeholder="Nova task..." maxlength="60" autocomplete="off" autocorrect="off" spellcheck="false">
          <button class="fab-btn" id="addBtn">+</button>
        </div>
        <div style="display: flex; justify-content: center; margin-top: 8px;">
          <button class="reset-btn" id="resetBtn"><i class="bi bi-trash3"></i> Reset</button>
        </div>
      </div>
    </div>
  </div>
 
  <div id="themeModal" class="theme-overlay">
    <div class="theme-panel">
      <h3>Temas</h3>
      <p>Escolha seu estilo — as cores das suas tasks serão atualizadas</p>
      <div id="themeListContainer" class="theme-list"></div>
      <button class="close-theme-btn" id="closeThemeBtn">Fechar</button>
    </div>
  </div>

  <div id="editModal" class="edit-overlay">
    <div class="edit-panel">
      <h3><i class="bi bi-pencil-square"></i> Editar Task</h3>
      <div class="edit-field">
        <label>Título</label>
        <textarea id="editTitle" rows="2" maxlength="100" placeholder="Digite o título..." style="resize: vertical; font-family: 'DM Sans', sans-serif; font-size: 15px; padding: 12px 16px; border-radius: 20px; border: 1.5px solid #e0d0c0; width: 100%; outline: none; background: white; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word;"></textarea>
      </div>
      <div class="edit-field">
        <label>Descrição</label>
        <textarea id="editDesc" rows="4" placeholder="Adicione uma descrição..."></textarea>
      </div>
      <div class="edit-buttons">
        <button class="edit-cancel-btn" id="editCancelBtn">Cancelar</button>
        <button class="edit-save-btn" id="editSaveBtn">Salvar</button>
      </div>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
